[general]
height = 7
empty_module = "app"
default_module = "open"
alternative_module = "goto"
control_module = ""
exec_cmd = "sh -c"
vi_mode = true
cheatsheet_entry = "?"
cheatsheet_viewer = "less -R; clear"
external_editor = "nvim"


[interface]
padding = [0, 1, 0, 1]
header = """
\x1b[1;38;2;203;166;247msea@nixos\x1b[0m
"""
header_color = "blue"
prompt_sign = "> "
prompt_sign_color = "blue"
placeholder = "type & search"
placeholder_color = "black"
suggestion_mode = "list"
suggestion_position = "bottom"
prefix_color = "yellow"
prefix_padding = 3
description_color = "reset"
selection_prefix = "▌ "
selection_prefix_color = "red"
inverse_selection = true
list_prefix = "  "
list_prefix_color = "reset"
indicator_args = ""
indicator_bare = ""
indicator_color = "red"
scrollbar = true
separator = true
separator_label = "  otter "


[image]
format = "kitty"
path = "~/Nix-conf/modules/features/otter-launcher/cat.png"
width = 12
position = "left"
padding = [0, 0, 0, 0]


[[modules]]
description = "internet search"
prefix = "gs"
cmd = "xdg-open https://duckduckgo.com/?q={}"
with_argument = true
url_encode = true
unbind_proc = true

[[modules]]
description = "programs"
prefix = "app"
cmd = """
umbriel msg window-set-primary-extent 0.365;
umbriel msg window-set-secondary-extent 0.600;
umbriel msg window-center;
fsel --refresh-cache >/dev/null 2>&1;
fsel -d
"""

[[modules]]
description = "bluetooth"
prefix = "bt"
cmd = """
umbriel msg window-set-primary-extent 0.365;
umbriel msg window-set-secondary-extent 0.600;
umbriel msg window-center;
bluetui
"""

[[modules]]
description = "audio"
prefix = "au"
cmd = """
umbriel msg window-set-primary-extent 0.365;
umbriel msg window-set-secondary-extent 0.600;
umbriel msg window-center;
wiremix
"""

[[modules]]
description = "wifi"
prefix = "wi"
cmd = """
umbriel msg window-set-primary-extent 0.365;
umbriel msg window-set-secondary-extent 0.600;
umbriel msg window-center;
wifitui
"""
[[modules]]
description = "set power profile"
prefix = "pp"
cmd = "powerprofilesctl set {}"
with_argument = true

[[modules]]
description = "Notes"
prefix = "no"
cmd = """
umbriel msg window-set-primary-extent 0.6;
umbriel msg window-set-secondary-extent 0.600;
umbriel msg window-center;
cd ~/Sync/Notes/;
nvim
"""

[[modules]]
description = "Nixos rebuild"
prefix = "nos"
cmd = """
umbriel msg window-set-primary-extent 0.365;
umbriel msg window-set-secondary-extent 0.600;
umbriel msg window-center;
umbriel msg window-toggle-pinned;
nh os switch 2>&1 | tee /tmp/nh-switch.log;
body=$(sed -E 's/\x1b\\[[0-9;]*m//g' /tmp/nh-switch.log | rg -iN -e '^PATHS:' -e '^SIZE:' -e '^error' | head -5)
[ -n "$body" ] || body="see /tmp/nh-switch.log"
notify-send "nixos-rebuild" "$body"
"""

[[modules]]
description = "Nixos gc"
prefix = "ncl"
cmd = """
umbriel msg window-set-primary-extent 0.365;
umbriel msg window-set-secondary-extent 0.600;
umbriel msg window-center;
umbriel msg window-toggle-pinned;
nh clean all 2>&1 | tee /tmp/nix-gc.log;
notify-send "nix gc" "$(tail -n 3 /tmp/nix-gc.log | sed -E 's/\x1b\\[[0-9;]*m//g; s/^> //')"
"""

[[modules]]
description = "Nixos generation switch"
prefix = "ngs"
cmd = """
umbriel msg window-set-primary-extent 0.365;
umbriel msg window-set-secondary-extent 0.600;
umbriel msg window-center;
umbriel msg window-toggle-pinned;
nixos-generation-switch
"""

[[modules]]
description = "flake update"
prefix = "nou"
cmd = """
umbriel msg window-set-primary-extent 0.365;
umbriel msg window-set-secondary-extent 0.600;
umbriel msg window-center;
umbriel msg window-toggle-pinned;
nix flake update --flake ~/Nix-conf;
nh os switch 2>&1 | tee /tmp/flake-update.log;
body=$(sed -E 's/\x1b\\[[0-9;]*m//g' /tmp/flake-update.log | rg -iN -e '^PATHS:' -e '^SIZE:' -e '^error' | head -5)
[ -n "$body" ] || body="see /tmp/flake-update.log"
notify-send "flake-update" "$body"
"""

[[modules]]
description = "nix shell"
prefix = "nsh"
cmd = """
kitty -e zsh -c 'cd ~/Nix-conf && IN_NIX_SHELL=impure nix shell nixpkgs#{}'
"""
with_argument = true
unbind_proc = true

[[modules]]
description = "Nixos fmt"
prefix = "nfm"
cmd = """
umbriel msg window-set-primary-extent 0.365;
umbriel msg window-set-secondary-extent 0.600;
umbriel msg window-center;
umbriel msg window-toggle-pinned;
cd ~/Nix-conf;
nix fmt . 2>&1 | tee /tmp/nix-fmt.log;
notify-send "nix fmt" "$(tail -n 3 /tmp/nix-fmt.log | sed -E 's/\x1b\\[[0-9;]*m//g; s/^> //')"
"""

[[modules]]
description = "clipboard history"
prefix = "ch"
cmd = """
umbriel msg window-set-primary-extent 0.365;
umbriel msg window-set-secondary-extent 0.600;
umbriel msg window-center;
cliphist list | fsel --dmenu --delimiter $'\t' --with-nth 2 | cliphist decode | wl-copy >/dev/null 2>&1
"""

[[modules]]
description = "notification history"
prefix = "nh"
cmd = """
umbriel msg window-set-primary-extent 0.365;
umbriel msg window-set-secondary-extent 0.600;
umbriel msg window-center;
makoctl history -j | jq -r '.[] | [
  ((.summary // "(no summary)") | gsub("[\t\r\n]"; " ")),
  ("app: " + (.app_name // "unknown")
   + " · urgency: " + (.urgency // "normal")
   + " · " + ((.body // "(no body)") | gsub("\t"; "    ") | gsub("\r"; "") | gsub("\n"; " ⏎ ")))
] | @tsv' | fsel --dmenu --delimiter $'\t' --with-nth 1
"""

[[modules]]
description = "toggle night light"
prefix = "nl"
cmd = "pkill -USR1 -x wlsunset"

[[modules]]
description = "fd file search"
prefix = "fd"
cmd = """
umbriel msg window-set-primary-extent 0.365;
umbriel msg window-set-secondary-extent 0.600;
umbriel msg window-center;
yazi "$(fd {} | fsel --dmenu --preview 'bat --color=never --style=numbers --paging=never --line-range=:200 -- "$FSEL_PREVIEW_ITEM"')"
"""
with_argument = true

[[modules]]
description = "clipboard history wipe"
prefix = "chw"
cmd = """
cliphist wipe
"""

[[modules]]
description = "lock"
prefix = "loc"
cmd = "loginctl lock-session"

[[modules]]
description = "logout"
prefix = "log"
cmd = "loginctl terminate-user $USER"

[[modules]]
description = "suspend"
prefix = "sus"
cmd = "systemctl suspend"

[[modules]]
description = "reboot"
prefix = "reb"
cmd = "systemctl reboot"

[[modules]]
description = "shutdown"
prefix = "shu"
cmd = "systemctl poweroff"

[[modules]]
description = "hibernate"
prefix = "hib"
cmd = "systemctl hibernate"

[[modules]]
description = "suspend then hibernate"
prefix = "sth"
cmd = "systemctl suspend-then-hibernate"

[[modules]]
description = "mullvad reconnect"
prefix = "mr"
cmd = "mullvad reconnect --wait"

[[modules]]
description = "mullvad search"
prefix = "ms"
cmd = '''
umbriel msg window-set-primary-extent 0.365;
umbriel msg window-set-secondary-extent 0.600;
umbriel msg window-center;
mullvad relay list | rg -o '[a-z]{2}-[a-z]{3}-wg-[0-9]+' | sort -u | fsel --dmenu | xargs -r mullvad relay set location
'''

[[modules]]
description = "run commands"
prefix = "sh"
cmd = """
$(printf $TERM | sed 's/xterm-//g') -e sh -c "{}"
"""
with_argument = true
unbind_proc = true

[[modules]]
description = "cheatsheet"
prefix = "che"
cmd = "umbriel msg cheatsheet-toggle"

[[modules]]
description = "search nixpkgs"
prefix = "ns"
cmd = "xdg-open https://mynixos.com/search?q={}"
with_argument = true
url_encode = true
unbind_proc = true

[[modules]]
description = "search nixwiki"
prefix = "nw"
cmd = "xdg-open https://wiki.nixos.org/w/index.php?search={}"
with_argument = true
url_encode = true
unbind_proc = true

[[modules]]
description = "yazi"
prefix = "ya"
cmd = """
umbriel msg window-set-primary-extent 0.6;
umbriel msg window-set-secondary-extent 0.600;
umbriel msg window-center;
yazi {}
"""
with_argument = true
