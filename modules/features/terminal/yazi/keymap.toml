  [[mgr.prepend_keymap]]
  desc = "Open or enter directory"
  on = ["l"]
  run = "plugin smart-enter"
  [[mgr.prepend_keymap]]
  desc = "Start bunny.yazi"
  on = ";"
  run = "plugin bunny"

  [[mgr.prepend_keymap]]
  desc = "Start bunny.yazi fuzzy search"
  on = "'"
  run = "plugin bunny fuzzy"
  [[mgr.prepend_keymap]]
  desc = "Diff selected file with hovered file"
  on = ["u", "d"]
  run = "plugin diff"
  [[mgr.prepend_keymap]]
  desc = "Open lazygit"
  on = ["g", "i"]
  run = "plugin lazygit"
  [[mgr.prepend_keymap]]
  desc = "Smart filter"
  on = ["f"]
  run = "plugin smart-filter"
  [[mgr.prepend_keymap]]
  desc = "Smart paste"
  on = ["p"]
  run = "plugin smart-paste"
  [[mgr.prepend_keymap]]
  desc = "Change file permissions"
  on = ["c", "m"]
  run = "plugin chmod"
  prepend_keymap = [
      # glow.yazi
      { on = ["<C-e>"], run = "seek 5" },
      { on = ["<C-y>"], run = "seek -5" },
  ]
  [[mgr.prepend_keymap]]
  on   = "e"
  run  = "plugin jump-to-char"
  desc = "Jump to char"
  [[mgr.prepend_keymap]]
  on   = [ "c", "a", "a" ]
  run  = "plugin compress"
  desc = "Archive selected files"

  [[mgr.prepend_keymap]]
  on   = [ "c", "a", "p" ]
  run  = "plugin compress -p"
  desc = "Archive selected files (password)"

  [[mgr.prepend_keymap]]
  on   = [ "c", "a", "h" ]
  run  = "plugin compress -ph"
  desc = "Archive selected files (password+header)"

  [[mgr.prepend_keymap]]
  on   = [ "c", "a", "l" ]
  run  = "plugin compress -l"
  desc = "Archive selected files (compression level)"

  [[mgr.prepend_keymap]]
  on   = [ "c", "a", "u" ]
  run  = "plugin compress -phl"
  desc = "Archive selected files (password+header+level)"
