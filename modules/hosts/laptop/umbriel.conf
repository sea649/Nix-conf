[general]
autostart = [
    "waybar",
    "swaybg-start",
    "nightlight-start",
    "swayosd-server",
    "wl-paste --watch cliphist store",
    "polkit-agent",
    "hypridle",
    "protonvpn-app",
]
mod_key = "Super"            # Mod in keybinds; defaults to Super (Alt when nested)
xwayland = true                # requires restart to change
show_cheatsheet = false         # show keybinds overlay on startup
focus_on_activate = true     # activation requests mark urgent without stealing focus
honor_restored_maximize = false # let apps restore their saved maximized state

# Animation ------------------------------------------------------------------

[animation]
enabled = true
duration_ms = 250              # 1-10000
curve = "easeout"

[animation.windows_in]
enabled = true
duration_ms = 150
curve = "easeout"
style = "popin"                # popin, zoom, slide, fade, none
scale = 0.85                   # 0.1-1.0, used by popin

[animation.windows_out]
enabled = true
duration_ms = 150
curve = "easeout"
style = "fade"                 # fade, slide

[animation.windows_move]
enabled = true
duration_ms = 250
curve = "snappy"

[animation.workspaces]
enabled = true
duration_ms = 250
curve = "easeout"

[animation.overview]
enabled = true
duration_ms = 250
curve = "easeout"

[animation.scratchpad]
enabled = false
duration_ms = 250
curve = "easeout"
dim = 0.5                      # 0.0-1.0
blur = false

[animation.border]
enabled = false
duration_ms = 250
curve = "easeout"

[animation.dim_unfocused]
enabled = false
duration_ms = 250
curve = "easeout"
dim = 0.0                      # 0.0-1.0

[animation.layers]
enabled = false
duration_ms = 250
curve = "easeout"

# Appearance -----------------------------------------------------------------

[colors]
shadow = "#0000007F"

[appearance]
prefer_no_csd = true
border_width = 0               # 0-100
outer_border_width = 0         # 0-100
corner_radius = 0             # 0-100, radius of the final decorated outer edge
drag_opacity = 0.75
opaque_fullscreen = true

[appearance.blur]
enabled = true
optimized = true
passes = 3                     # 0-8
radius = 5                     # 0-100
noise = 0.02                   # 0.0-1.0
brightness = 0.9               # 0.0-2.0
contrast = 0.9                 # 0.0-2.0
saturation = 1.1               # 0.0-2.0

[appearance.shadow]
enabled = true
softness = 10                  # 0-200, 0 = hard edge
offset_x = 2                   # -200 to 200
offset_y = 2

# Overview -------------------------------------------------------------------

[overview]
zoom = 0.5                     # 0.1-0.75
background_blur = true        # blur the wallpaper while the overview is open
workspace_wallpaper = true
shortcuts = false

# Hot corners ---------------------------------------------------------------

[hot_corners.top_left]
enabled = false
delay_ms = 500                # 0-10000, 0 activates immediately
action = "overview-open"

[hot_corners.top_right]
enabled = false
delay_ms = 500
action = "overview-close"

[hot_corners.bottom_left]
enabled = false
delay_ms = 500
action = "overview-toggle"

[hot_corners.bottom_right]
enabled = false
delay_ms = 500
action = "spawn notify-send 'Bottom right'"

[workspaces]
back_and_forth = true
empty_above = false

# Layout ---------------------------------------------------------------------

[layout]
mode = "scrolling"             # "scrolling", "dwindle", or "master"
gap = 5                        # 0-500
extent_presets = [0.5, 0.8, 1.0] # shared by scrolling, dwindle, and master

[layout.scrolling]
default_extent_fraction = 0.8  # remove to let clients choose their initial width
center_underfull_strip = true  # center the strip whenever it is narrower than the viewport

[layout.dwindle]

[layout.master]
position = "left"              # "left" or "right"
default_width_fraction = 0.55  # 0.1-0.9

[input]
middle_click_paste = true      # primary-selection clipboard, applies on reload

[input.keyboard]
layout = "gb"                    # "us,de" loads both; switch with keyboard-layout-next
variant = ""
options = ""                   # XKB options, e.g. "grp:alt_shift_toggle"
repeat_rate = 40               # 0-1000 Hz
repeat_delay = 300             # 0-10000 ms
numlock_toggle = false # true enables NumLock when a keyboard connects; false leaves it off

[input.touchpad]
enabled = true
tap = true
tap_and_drag = false
drag_lock = "off"
natural_scroll = true
left_handed = false

[input.mouse]
natural_scroll = false
# accel_profile = "flat"       # omitted preserves the device's libinput default
sensitivity = 0.0              # pointer speed, -1.0 to 1.0
scroll_wheel_step = 60         # 1-1000

[input.tablet]
enabled = true                 # false disables the tablet and its pads

[input.cursor]
theme = "Bibata-Modern-Ice"
size = 24                      # 1-512
hardware_cursor = true         # false forces software cursor composition
follows_focus = false          # warp to windows selected by focus navigation
hide_when_typing = false       # hide after typing unless a pointer button is held
hide_timeout_ms = 0            # 0-3600000, 0 disables hiding

[input.focus]
follows_mouse = false

[keybinds]

#[system]
"Mod+Q" = "window-close"
"Mod+Shift+R" = "config-reload"
"Mod+G" = "window-toggle-pinned"
"Mod+M" = "session-quit"
"Alt+Tab" = "overview-toggle"
"Mod+Tab" = "window-focus-next"
"Mod+N" = "workspace-set-layout toggle"

#[screenshot]
"Print" = "spawn screenshot-region"
"Shift+Print" = "spawn screenshot-monitor"

"Mod+P" = "spawn hyprlock"

"Escape" = "submap reset"

#[spawn]
"Mod+Shift+Return" = "spawn kitty"
"Mod+Space" = "spawn sh -c 'kitty --title=otter-launcher -e otter-launcher'"
"Mod+Shift+Q" = "spawn helium"
"Mod+Shift+D" = "spawn kitty -e nvim"
"Mod+Shift+S" = "spawn obsidian"
"Mod+Shift+A" = "spawn stremio"

#[focus]
"Alt+Shift+Return" = "spawn wlrctl window focus kitty"
"Alt+Shift+E" = "spawn wlrctl window focus thunar"
"Alt+Shift+Q" = "spawn wlrctl window focus helium"
"Alt+Shift+S" = "spawn wlrctl window focus md.Obsidian"
"Alt+Shift+A" = "spawn wlrctl window focus com.stremio.Stremio"

#[window]
"Mod+Shift+F" = { action = "submap window", repeat = false }
"submap[window],D" = { action = "window-cycle-primary-extent", repeat = false }
"submap[window],Shift+F" = { action = "window-toggle-maximize-to-edges", submap = "reset" }
"submap[window],F" = { action = "window-toggle-fullscreen", submap = "reset" }
"submap[window],Space" = { action = "window-toggle-floating", submap = "reset" }

#[scratchpad]
"Mod+E" = { action = "submap scratchpad", repeat = false }
"submap[scratchpad],A" = { action = "spawn sonora", submap = "reset" }
"submap[scratchpad],W" = { action = "spawn serein", submap = "reset" }
"submap[scratchpad],Grave" = { action = "spawn sh -c 'kitty --title=scratchpad-terminal'", submap = "reset" }
"submap[scratchpad],S" = { action = "spawn sh -c 'kitty --title=scratchpad-bottom -e btm'", submap = "reset" }
"submap[scratchpad],F" = { action = "spawn sh -c 'kitty --title=scratchpad-opencode -e /run/current-system/sw/bin/opencode-launcher'", submap = "reset" }
"submap[scratchpad],Z" = { action = "spawn obs", submap = "reset" }
"Mod+Grave" = { action = "scratchpad-toggle terminal", submap = "reset" }
"Mod+S" = { action = "scratchpad-toggle bottom", submap = "reset" }
"Mod+W" = { action = "scratchpad-toggle serein", submap = "reset" }
"Mod+A" = { action = "scratchpad-toggle sonora", submap = "reset" }
"Mod+F" = { action = "scratchpad-toggle opencode", submap = "reset" }
"Mod+Z" = { action = "scratchpad-toggle obs", submap = "reset" }

#[workspace]
"Mod+1" = { action = "workspace-switch 1", repeat = false }
"Alt+1" = { action = "window-move-to-workspace 1", repeat = false }
"Mod+2" = { action = "workspace-switch 2", repeat = false }
"Alt+2" = { action = "window-move-to-workspace 2", repeat = false }
"Mod+3" = { action = "workspace-switch 3", repeat = false }
"Alt+3" = { action = "window-move-to-workspace 3", repeat = false }
"Mod+4" = { action = "workspace-switch 4", repeat = false }
"Alt+4" = { action = "window-move-to-workspace 4", repeat = false }
"Mod+5" = { action = "workspace-switch 5", repeat = false }
"Alt+5" = { action = "window-move-to-workspace 5", repeat = false }

#[vim controls]
"Mod+H" = "window-focus-left"
"Mod+J" = "workspace-next"
"Mod+K" = "workspace-previous"
"Mod+L" = "window-focus-right"
"Mod+Shift+H" = "column-move-left"
"Mod+Shift+J" = "window-move-down"
"Mod+Shift+K" = "window-move-up"
"Mod+Shift+L" = "column-move-right"
"Alt+H" = "window-focus-left"
"Alt+J" = "window-focus-down"
"Alt+K" = "window-focus-up"
"Alt+L" = "window-focus-right"

#[arrow controls]
"Mod+Left" = "window-focus-left"
"Mod+Right" = "window-focus-right"
"Mod+Up" = "window-focus-up"
"Mod+Down" = "window-focus-down"
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Right" = "column-move-right"
"Alt+Left" = "window-focus-left"
"Alt+Right" = "window-focus-right"
"Alt+Up" = "window-focus-up"
"Alt+Down" = "window-focus-down"

#[scroll wheel controls]
"Mod+WheelUp" = "workspace-previous"
"Mod+WheelDown" = "workspace-next"
"Mod+Shift+WheelUp" = "column-move-left"
"Mod+Shift+WheelDown" = "column-move-right"

#[media and brightness keys]
"XF86AudioRaiseVolume" = { action = "spawn swayosd-client --output-volume raise", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn swayosd-client --output-volume lower", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn swayosd-client --output-volume mute-toggle", allow_when_locked = true, repeat = false }
"XF86AudioMicMute" = { action = "spawn swayosd-client --input-volume mute-toggle", allow_when_locked = true, repeat = false }
"XF86MonBrightnessUp" = { action = "spawn swayosd-client --brightness raise", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn swayosd-client --brightness lower", allow_when_locked = true }
"XF86AudioPlay" = { action = "spawn swayosd-client --playerctl play-pause", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn swayosd-client --playerctl next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn swayosd-client --playerctl previous", allow_when_locked = true }
"Caps_Lock" = { action = "spawn sh -c 'sleep 0.05; swayosd-client --caps-lock'", repeat = false, allow_when_locked = true }
"Num_Lock" = { action = "spawn sh -c 'sleep 0.05; swayosd-client --num-lock'", repeat = false, allow_when_locked = true }

# scratchpads ---------------------------------------------------------------------

[[scratchpad]]
name = "terminal"
spawn_when_empty = "sh -c 'kitty --title=scratchpad-terminal'"

[[scratchpad]]
name = "bottom"
spawn_when_empty = "sh -c 'kitty --title=scratchpad-bottom -e btm'"

[[scratchpad]]
name = "opencode"

[[scratchpad]]
name = "sonora"

[[scratchpad]]
name = "serein"

[[scratchpad]]
name = "obs"

# Window and layer rules (see docs/user/rules.md) ---------------------------

# Blur all windows
[[window_rule]]
blur = true
blur_optimized = true

[[window_rule]]
match.is_alone = true
default_scrolling_extent = 1.0

[[window_rule]]
match.title = "^scratchpad-terminal$"
default_scratchpad = "terminal"
default_floating = true
default_floating_size = { width = 0.85, height = 0.85 }

[[window_rule]]
match.title = "^scratchpad-bottom$"
default_scratchpad = "bottom"
default_floating = true
default_floating_size = { width = 0.85, height = 0.85 }

[[window_rule]]
match.title = "^scratchpad-opencode$"
default_scratchpad = "opencode"
default_floating = true
default_floating_size = { width = 0.85, height = 0.85 }

[[window_rule]]
match.app_id = "^sonora$"
default_scratchpad = "sonora"
default_floating = true
default_floating_size = { width = 0.85, height = 0.85 }
block_capture = true

[[window_rule]]
match.app_id = "serein"
default_scratchpad = "serein"
default_floating = true
default_floating_size = { width = 0.85, height = 0.85 }

[[window_rule]]
match.app_id = "^com[.]obsproject[.]Studio$"
default_scratchpad = "obs"
default_floating = true
default_floating_size = { width = 0.85, height = 0.85 }

[[window_rule]]
match.title = "^otter-launcher$"
default_floating = true
default_floating_size = { width = 0.25, height = 0.15 }
default_pinned = true

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size = { width = 0.85, height = 0.85 }
default_pinned = true

[[window_rule]]
match.app_id = "^org[.]satty[.]satty$"
default_floating = true
default_floating_size = { width = 0.85, height = 0.85 }
default_pinned = true

[[window_rule]]
match.app_id = "^org[.]prismlauncher[.]PrismLauncher$"
default_workspace = 1

[[window_rule]]
match.app_id = "^steam$"
default_workspace = 1

[[window_rule]]
match.app_id = "^helium$"
default_workspace = 2

[[window_rule]]
match.app_id = "^librewolf$"
default_workspace = 2


[[window_rule]]
match.app_id = "^obsidian$"
default_workspace = 2

[[window_rule]]
match.app_id = "^com[.]github[.]johnfactotum[.]Foliate$"
default_workspace = 2

[[window_rule]]
match.app_id = "^com[.]stremio[.]Stremio$"
default_workspace = 2
default_fullscreen = false
default_scrolling_extent = 1.0

[[window_rule]]
match.app_id = "^blockbench$"
default_workspace = 3

[[window_rule]]
match.app_id = "^thunar$"
default_workspace = 3

[[window_rule]]
match.app_id = "proton"
block_capture = true

# Outputs (see docs/user/outputs.md) ----------------------------------------

[output."eDP-1"]
mode = "1920x1080@60"
position = [0, 0]
workspaces = 5
cyclic_workspaces = true
