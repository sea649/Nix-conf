# [[window_rule]]
# match.title = "^notificationtoasts_.+_desktop"
# default_position = { x = 0, y = 0, anchor = "bottom_right" }
# default_focused = false
# default_pinned = true

[[window_rule]]
match.app_id = "^org[.]prismlauncher[.]PrismLauncher$"
default_workspace = 1

[[window_rule]]
match.app_id = "^steam$"
default_workspace = 1

[[window_rule]]
match.app_id = "^helium$"
default_workspace = 2

[[window_rule]]
match.app_id = "^librewolf$"
default_workspace = 2


[[window_rule]]
match.app_id = "^obsidian$"
default_workspace = 2

[[window_rule]]
match.app_id = "^com[.]github[.]johnfactotum[.]Foliate$"
default_workspace = 2

[[window_rule]]
match.app_id = "^com[.]stremio[.]Stremio$"
default_workspace = 2
default_fullscreen = false
default_scrolling_extent = 1.0

[[window_rule]]
match.app_id = "^blockbench$"
default_workspace = 3

[[window_rule]]
match.app_id = "^thunar$"
default_workspace = 3

[[window_rule]]
match.app_id = "^noctalia-rebuild$"
default_floating = true
default_scrolling_extent = 1.0

[[window_rule]]
match.app_id = "proton"
block_capture = true

# Layer rules (see docs/user/rules.md#layer-rules) ---------------------------

[[layer_rule]]
match.namespace="^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd)$"
blur = true
blur_ignore_alpha = 0.5
blur_optimized = false

# Outputs (see docs/user/outputs.md) ----------------------------------------

[output."eDP-1"]
mode = "1920x1080@60"
position = [0, 0]
workspaces = 5
cyclic_workspaces = true
