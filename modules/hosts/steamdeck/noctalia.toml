[plugin_settings."sea/todo"]
panel_placement = "floating"

[plugin_settings."sea/vars-editor"]
panel_placement = "floating"
panel_position = "top_left"

[plugins]
enabled = [
    "sea/tips",
    "sea/vars-editor",
    "nightwatch75/todo",
    "noctalia/bongocat",
    "dotnetrob/cat",
    "noctalia/notes",
    "noctalia/translator",
    "ashur-d/wallpaper-widget",
    "noctalia/wallpaper_depth"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "/home/sea/.local/share/noctalia/plugins-dev"
    name = "mango-layout"

    [[plugins.source]]
    kind = "path"
    location = "/home/sea/.config/noctalia/plugins-dev"
    name = "dev"

[shell]
app_icon_color = "primary"
avatar_path = "/home/sea/Nix-conf/assets/noctalia/avatar/avatar.png"
clipboard_confirm_clear_history = false
corner_radius_scale = 0.0
font_family = "Maple Mono NF ExtraBold"
polkit_agent = true
polkit_colorize_icons = false
screen_time_colorize_icons = false
screen_time_enabled = false
settings_window_translucent = true
show_close_buttons = false
show_location = false
umbriel_overview_close_on_launch_enabled = true
umbriel_overview_type_to_launch_enabled = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    app_grid = true
    categories = false
    category_icons_only = true
    colorize_icons = false
    compact = false
    default_view = "all"
    pinned = [
        "org.prismlauncher.PrismLauncher",
        "steam",
        "com.github.johnfactotum.Foliate",
        "com.stremio.Stremio",
        "obsidian",
        "thunar",
        "zen",
        "blockbench"
    ]
    search_position = "top"
    show_app_actions = true
    show_app_origin_indicator = false
    show_icons = true
    show_session_button = false
    show_settings_button = false

        [shell.launcher.providers.emoji]
        global = true

        [shell.launcher.providers.session]
        global = false

        [shell.launcher.providers.wallpaper]
        global = false

    [shell.panel]
    borders = true
    control_center_placement = "floating"
    control_center_position = "auto"
    launcher_position = "center"
    list_item_background = true
    open_near_click_control_center = true
    open_near_click_wallpaper = true
    session_placement = "floating"
    session_position = "top_center"
    transparency_mode = "glass"
    wallpaper_placement = "floating"
    wallpaper_position = "auto"
    wallpaper_show_names = false

    [shell.screen_corners]
    enabled = false
    size = 30

    [shell.screenshot]
    annotate = true
    confirm_region = true
    directory = "/home/sea/Pictures/screenshots"
    skip_annotate_on_copy_save = true

    [shell.session]
    grid = true
    grid_columns = 5

    [shell.shadow]
    direction = "down_right"

    [shell.window_switcher]
    colorize_icons = false
    mru = true

[theme]
builtin = "Catppuccin"
community_palette = "Paradise"
mode = "dark"
pure_black_dark = false
source = "builtin"
wallpaper_scheme = "m3-fruit-salad"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "kitty", "umbriel" ]
    community_ids = [ "opencode", "sonora", "discord", "obsidian", "prismlauncher", "lazygit", "tmux" ]
    enable_builtin_templates = false
    enable_community_templates = false

        [theme.templates.user.spicetify-noctalia]
        input_path = "~/Nix-conf/noctalia/templates/spicetify-noctalia.ini"
        output_path = "$XDG_CONFIG_HOME/spicetify/Themes/Noctalia/color.ini"
        post_hook = "spicetify -q apply --no-restart"

[wallpaper]
directory = "/home/sea/Nix-conf/assets/wallpaper"
directory_dark = "/home/sea/Nix-conf/assets/wallpaper"
directory_light = "/home/sea/Nix-conf/assets/wallpaper"
enabled = false
transition_on_startup = true

    [wallpaper.automation]
    enabled = false

    [wallpaper.default]
    path = "/home/sea/Nix-conf/assets/wallpaper/wallhaven-x6x3gz_1920x1200.png"

    [wallpaper.last]
    path = "/home/sea/Nix-conf/assets/wallpaper/wallhaven-x6x3gz_1920x1200.png"

    [wallpaper.monitors.DP-1]
    path = "/home/sea/Nix-conf/assets/wallpaper/wallhaven-x6x3gz_1920x1200.png"

    [wallpaper.monitors.WL-1]
    path = "/home/sea/Nix-conf/wallpaper/wallhaven-e7kpl8_1920x1200.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/sea/Nix-conf/wallpaper/wallhaven-gw2e9e_1920x1200.png"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/sea/Nix-conf/assets/wallpaper/wallhaven-ducks-flowers.png"
    theme_mode = "dark"
    wallpaper_scheme = "m3-content"

    [[wallpaper.favorite]]
    builtin_palette = "Catppuccin"
    palette_source = "builtin"
    path = "/home/sea/Nix-conf/assets/wallpaper/wallhaven-x6x3gz_1920x1200.png"
    theme_mode = "dark"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/sea/Nix-conf/assets/wallpaper/wallhaven-z8p9rj_1920x1200.png"
    theme_mode = "dark"
    wallpaper_scheme = "m3-content"

